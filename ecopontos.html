<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoRota — Ecopontos</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="page-ecopontos">

<header>
  <div class="logo">
    EcoRota
    <span>Praia Grande · SP</span>
  </div>
  <nav class="nav">
    <a href="index.html" class="nav-link">Buscar</a>
    <a href="ecopontos.html" class="nav-link ativo">Ecopontos</a>
    <a href="materiais.html" class="nav-link">Materiais</a>
    <a href="sobre.html" class="nav-link">Sobre</a>
    <a href="contribuicao.html" class="nav-link">Contribuição</a>
    <a class="nav-link toggle-dark-mode"><i class="bi bi-brightness-high"></i></a>
  </nav>
</header>

<div class="page-layout">
  <h1 class="page-title">Ecopontos cadastrados</h1>
  <p class="page-sub">Pontos de coleta disponíveis em Praia Grande. Pesquise por nome ou bairro.</p>

  <div class="filtro-bar">
    <input
      class="filtro-input"
      type="text"
      id="buscaInput"
      placeholder='Buscar por nome ou bairro...'
      oninput="filtrar()"
    >
  </div>

  <div class="lista-ecopontos" id="lista"></div>
</div>

<script src="script.js"></script>
<script>
// Modo escuro persistente
if (localStorage.getItem('dark') === 'true') {
  document.body.classList.add('dark');
}

document.querySelector('.toggle-dark-mode').addEventListener('click', () => {
  document.body.classList.toggle('dark');
  localStorage.setItem('dark', document.body.classList.contains('dark'));
});

// Dados dos ecopontos e categorias
const CATS = CATEGORIAS; // vem do script.js

function filtrar() {
  const termo = document.getElementById('buscaInput').value.toLowerCase();
  const filtrados = ECOPONTOS.filter(ep =>
    ep.nome.toLowerCase().includes(termo) ||
    ep.endereco.toLowerCase().includes(termo)
  );
  renderLista(filtrados);
}

function renderLista(pontos) {
  const lista = document.getElementById('lista');

  if (pontos.length === 0) {
    lista.innerHTML = '<div class="nenhum">Nenhum ecoponto encontrado.</div>';
    return;
  }

  lista.innerHTML = pontos.map(ep => {
    const tags = ep.materiais.map(m => {
      const c = CATS.find(x => x.id === m);
      return `<span class="tag">${c ? '<i class="bi ' + c.emoji + '"></i> ' + c.nome : m}</span>`;
    }).join('');

    return `
      <div class="ep-card">
        <div class="ep-nome">${ep.nome}</div>
        <div class="ep-info">
          <span><i class="bi bi-geo-alt-fill"></i> ${ep.endereco}</span>
          <span><i class="bi bi-clock-fill"></i> ${ep.horario}</span>
          <span><i class="bi bi-telephone-fill"></i> ${ep.telefone}</span>
        </div>
        <div class="ep-tags">${tags}</div>
      </div>`;
  }).join('');
}

renderLista(ECOPONTOS);
</script>
</body>
</html>
